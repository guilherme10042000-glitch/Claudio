<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap');
:root{
  --blue:#00aaff;--blue-dim:#00aaff18;--blue-glow:#00aaff50;
  --cyan:#00d4ff;--purple:#6644ff;--green:#00ff88;
  --bg:#020810;--panel:#040d1a;--border:#0a2035;
  --text:#7ab8d4;--bright:#d0eeff;--muted:rgba(120,180,210,.38);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);height:100vh;overflow:hidden;}
#bgc{position:fixed;inset:0;z-index:0;pointer-events:none;}
.grid{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(0,170,255,.013) 1px,transparent 1px),linear-gradient(90deg,rgba(0,170,255,.013) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;}
.vign{position:fixed;inset:0;z-index:2;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.92) 100%);pointer-events:none;}
.scan{position:fixed;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.15),transparent);animation:sc 10s linear infinite;pointer-events:none;z-index:999;}
@keyframes sc{0%{top:0;opacity:0}4%{opacity:1}96%{opacity:.25}100%{top:100vh;opacity:0}}
.co{position:fixed;width:18px;height:18px;border-color:rgba(0,170,255,.25);border-style:solid;pointer-events:none;z-index:999;}
.tl{top:10px;left:10px;border-width:1px 0 0 1px}.tr{top:10px;right:10px;border-width:1px 1px 0 0}
.bl{bottom:10px;left:10px;border-width:0 0 1px 1px}.br{bottom:10px;right:10px;border-width:0 1px 1px 0}

.app{position:relative;z-index:10;display:grid;grid-template-columns:210px 1fr;height:100vh;}

/* SIDEBAR */
.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(2,8,16,.97);overflow:hidden;}
.sb-logo-area{padding:16px 14px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-logo{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;color:var(--blue);letter-spacing:6px;text-shadow:0 0 18px var(--blue-glow);animation:lp 5s ease-in-out infinite;}
@keyframes lp{0%,100%{text-shadow:0 0 18px var(--blue-glow)}50%{text-shadow:0 0 35px var(--blue),0 0 70px var(--blue-glow)}}
.sb-sub{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.28);letter-spacing:2px;margin-top:2px;}

.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:9px 0;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;color:rgba(0,170,255,.32);text-align:center;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;}
.tab:hover{color:rgba(0,170,255,.55);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.tab-panel{display:none;flex-direction:column;flex:1;overflow:hidden;}
.tab-panel.active{display:flex;}

.new-btn{margin:9px 11px 7px;padding:8px;background:rgba(0,170,255,.05);border:1px solid rgba(0,170,255,.16);border-radius:5px;color:var(--blue);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;transition:all .2s;flex-shrink:0;}
.new-btn:hover{background:rgba(0,170,255,.11);}

.scroll-list{flex:1;overflow-y:auto;padding:4px 9px 10px;scrollbar-width:thin;scrollbar-color:var(--blue-dim) transparent;}
.scroll-list::-webkit-scrollbar{width:3px;}.scroll-list::-webkit-scrollbar-thumb{background:var(--blue-dim);}

.hist-label{font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:2.5px;color:rgba(0,170,255,.25);padding:6px 2px 5px;border-bottom:1px solid var(--border);margin-bottom:5px;}

.agent-item,.chat-item{padding:9px 10px;border-radius:5px;cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:4px;position:relative;}
.agent-item:hover,.chat-item:hover{background:var(--blue-dim);border-color:rgba(0,170,255,.12);}
.agent-item.sel,.chat-item.sel{background:rgba(0,170,255,.06);border-color:rgba(0,170,255,.2);}
.agent-item.sel::before,.chat-item.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;border-radius:2px 0 0 2px;}
.agent-item.sel::before{background:linear-gradient(180deg,var(--blue),var(--purple));}
.chat-item.sel::before{background:var(--cyan);}
.ai-name{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:var(--blue);letter-spacing:1px;margin-bottom:2px;}
.ai-desc{font-size:9px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ci-title{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px;}
.ci-preview{font-size:8px;color:rgba(0,170,255,.28);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px;}
.ci-meta{display:flex;justify-content:space-between;margin-top:3px;}
.ci-date,.ci-count{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.2);}
.item-del{position:absolute;top:6px;right:6px;width:16px;height:16px;border:none;background:transparent;color:rgba(0,170,255,.18);cursor:pointer;font-size:10px;display:none;align-items:center;justify-content:center;}
.agent-item:hover .item-del,.chat-item:hover .item-del{display:flex;}
.item-del:hover{color:rgba(255,50,50,.6);}
.empty-st{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(0,170,255,.16);text-align:center;padding:20px 10px;line-height:2.2;letter-spacing:1px;}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;}
.mh{border-bottom:1px solid var(--border);padding:0 18px;height:50px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,8,16,.97);flex-shrink:0;position:relative;}
.mh::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),var(--blue),transparent);animation:hl 4s ease-in-out infinite;}
@keyframes hl{0%,100%{opacity:.16}50%{opacity:.5}}
.mh-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 6px var(--blue);animation:pd 2s ease-in-out infinite;flex-shrink:0;}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.2}}
.mh-name{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--blue);letter-spacing:3px;}
.mh-status{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.3);letter-spacing:1px;}
.mh-actions{display:flex;align-items:center;gap:8px;}
.mh-btn{padding:4px 8px;background:transparent;border:1px solid rgba(0,170,255,.15);border-radius:4px;color:rgba(0,170,255,.45);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:1px;transition:all .2s;}
.mh-btn:hover{background:var(--blue-dim);color:var(--blue);}
#clk{font-family:'Orbitron',monospace;font-size:11px;color:var(--blue);letter-spacing:1px;}
#dt{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.25);}

/* CHAT AREA */
.chat-area{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--blue-dim) transparent;}
.chat-area::-webkit-scrollbar{width:3px;}.chat-area::-webkit-scrollbar-thumb{background:var(--blue-dim);}

/* WELCOME */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;text-align:center;}
#bc2{width:150px;height:150px;}
.w-title{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;color:var(--blue);letter-spacing:5px;text-shadow:0 0 22px var(--blue-glow);}
.w-sub{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(0,170,255,.28);letter-spacing:2px;line-height:2;}
.qcs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.qc{padding:4px 11px;background:var(--blue-dim);border:1px solid rgba(0,170,255,.13);border-radius:14px;font-size:8px;color:rgba(0,170,255,.42);cursor:pointer;transition:all .2s;font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
.qc:hover{background:rgba(0,170,255,.09);color:var(--blue);}

/* MESSAGES */
.msg{display:flex;gap:8px;animation:mi .2s ease;}
@keyframes mi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;flex-direction:row-reverse;max-width:82%;}
.msg.j{align-self:flex-start;max-width:90%;}
.av{width:26px;height:26px;border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:7px;}
.av.j{background:rgba(0,170,255,.1);border:1px solid rgba(0,170,255,.16);color:var(--blue);}
.av.u{background:rgba(100,68,255,.08);border:1px solid rgba(100,68,255,.14);color:var(--purple);}
.bub{padding:8px 12px;border-radius:5px;font-size:13px;line-height:1.65;position:relative;}
.msg.j .bub{background:rgba(0,170,255,.04);border:1px solid rgba(0,170,255,.09);color:var(--bright);border-top-left-radius:0;}
.msg.j .bub::before{content:'';position:absolute;top:0;left:-1px;bottom:0;width:2px;background:linear-gradient(180deg,var(--blue),var(--purple));border-radius:1px;}
.msg.u .bub{background:rgba(100,68,255,.06);border:1px solid rgba(100,68,255,.11);color:var(--bright);border-top-right-radius:0;}
.msg-lbl{font-family:'Share Tech Mono',monospace;font-size:6px;letter-spacing:1.5px;margin-bottom:3px;opacity:.3;}
.msg.j .msg-lbl{color:var(--blue)}.msg.u .msg-lbl{color:var(--purple);text-align:right;}

/* MSG ACTIONS */
.msg-actions{display:flex;gap:4px;margin-top:5px;opacity:0;transition:opacity .2s;}
.msg:hover .msg-actions{opacity:1;}
.ma-btn{padding:2px 7px;background:transparent;border:1px solid rgba(0,170,255,.12);border-radius:3px;color:rgba(0,170,255,.4);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.5px;transition:all .2s;}
.ma-btn:hover{background:var(--blue-dim);color:var(--blue);}
.ma-btn.copied{color:var(--green);border-color:rgba(0,255,136,.3);}

/* ARTIFACTS */
.artifact-block{margin-top:8px;border:1px solid rgba(0,170,255,.15);border-radius:6px;overflow:hidden;}
.artifact-header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(0,170,255,.05);border-bottom:1px solid rgba(0,170,255,.1);}
.artifact-title{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(0,170,255,.6);letter-spacing:1px;}
.artifact-actions{display:flex;gap:4px;}
.art-btn{padding:2px 7px;background:transparent;border:1px solid rgba(0,170,255,.15);border-radius:3px;color:rgba(0,170,255,.45);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.5px;transition:all .2s;}
.art-btn:hover{background:var(--blue-dim);color:var(--blue);}
.artifact-body{background:rgba(0,0,0,.3);padding:10px 12px;font-family:'Share Tech Mono',monospace;font-size:11px;color:#88ccee;line-height:1.6;max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
.artifact-preview{width:100%;border:none;min-height:200px;max-height:360px;background:#020810;}

/* TYPING */
.typing{display:none;align-self:flex-start;gap:8px;align-items:center;}
.typing.on{display:flex;}
.tdots{display:flex;gap:4px;padding:8px 11px;background:rgba(0,170,255,.03);border:1px solid rgba(0,170,255,.08);border-radius:5px;border-top-left-radius:0;}
.td{width:4px;height:4px;border-radius:50%;background:var(--blue);animation:tda 1.2s ease-in-out infinite;}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tda{0%,60%,100%{transform:translateY(0);opacity:.25}30%{transform:translateY(-5px);opacity:1}}

/* FILE UPLOAD AREA */
.file-preview-area{padding:6px 18px;display:flex;flex-wrap:wrap;gap:6px;}
.file-chip{display:flex;align-items:center;gap:5px;padding:4px 8px;background:rgba(0,170,255,.07);border:1px solid rgba(0,170,255,.15);border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--blue);}
.file-chip-del{cursor:pointer;color:rgba(0,170,255,.4);font-size:11px;line-height:1;}
.file-chip-del:hover{color:rgba(255,50,50,.7);}

/* INPUT */
.inz{border-top:1px solid var(--border);padding:10px 18px;display:flex;flex-direction:column;gap:5px;background:rgba(2,8,16,.97);flex-shrink:0;}
.inz-row{display:flex;gap:7px;align-items:center;}
#vbtn{width:36px;height:36px;border-radius:5px;border:1px solid rgba(0,170,255,.15);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;transition:all .3s;background:rgba(0,170,255,.03);color:var(--blue);flex-shrink:0;}
#vbtn:hover{background:rgba(0,170,255,.07);}
#vbtn.active{background:rgba(255,50,50,.12);border-color:rgba(255,50,50,.35);color:#ff4444;animation:vp .85s ease-in-out infinite;}
@keyframes vp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#uploadBtn{width:36px;height:36px;border-radius:5px;border:1px solid rgba(0,170,255,.15);cursor:pointer;background:rgba(0,170,255,.03);color:rgba(0,170,255,.45);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;flex-shrink:0;}
#uploadBtn:hover{background:rgba(0,170,255,.08);color:var(--blue);}
#fileInput{display:none;}
#inp{flex:1;background:rgba(0,170,255,.025);border:1px solid rgba(0,170,255,.1);border-radius:5px;padding:9px 12px;color:var(--bright);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;caret-color:var(--blue);resize:none;min-height:38px;max-height:120px;line-height:1.4;}
#inp::placeholder{color:rgba(0,170,255,.13);}
#inp:focus{border-color:rgba(0,170,255,.28);box-shadow:0 0 0 1px var(--blue-dim);}
#sbtn{width:36px;height:36px;background:rgba(0,170,255,.08);border:1px solid var(--blue-dim);border-radius:5px;color:var(--blue);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
#sbtn:hover{background:rgba(0,170,255,.14);transform:scale(1.04);}
#sbtn:disabled{opacity:.25;cursor:not-allowed;transform:none;}
#vst{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.2);letter-spacing:1px;padding:0 2px;}
.wf{display:flex;align-items:center;gap:2px;height:14px;}
.wb{width:2px;border-radius:1px;background:rgba(0,170,255,.1);height:3px;}
.wb.on{background:var(--blue);animation:wva 1.2s ease-in-out infinite;}
@keyframes wva{0%,100%{height:3px}50%{height:11px}}

/* MARKDOWN */
.bub h1,.bub h2,.bub h3{color:var(--cyan);font-family:'Orbitron',monospace;margin:8px 0 5px;letter-spacing:1px;}
.bub h1{font-size:15px}.bub h2{font-size:13px}.bub h3{font-size:11px}
.bub p{margin:4px 0;}
.bub ul,.bub ol{padding-left:18px;margin:4px 0;}
.bub li{margin:2px 0;}
.bub code{background:rgba(0,170,255,.08);border:1px solid rgba(0,170,255,.12);border-radius:3px;padding:1px 5px;font-family:'Share Tech Mono',monospace;font-size:11px;color:#88ddff;}
.bub pre{background:rgba(0,0,0,.4);border:1px solid rgba(0,170,255,.12);border-radius:5px;padding:10px;margin:6px 0;overflow-x:auto;}
.bub pre code{background:none;border:none;padding:0;font-size:11px;}
.bub blockquote{border-left:2px solid rgba(0,170,255,.3);padding-left:10px;color:var(--muted);margin:5px 0;}
.bub table{border-collapse:collapse;margin:6px 0;font-size:11px;width:100%;}
.bub th{background:rgba(0,170,255,.08);border:1px solid rgba(0,170,255,.12);padding:4px 8px;color:var(--blue);font-family:'Share Tech Mono',monospace;font-size:10px;}
.bub td{border:1px solid rgba(0,170,255,.08);padding:4px 8px;font-size:11px;}
.bub strong{color:#d0eeff;}
.bub em{color:rgba(0,200,255,.7);}
.bub hr{border:none;border-top:1px solid var(--border);margin:8px 0;}
.bub a{color:var(--blue);text-decoration:underline;}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.mb{background:#030d1c;border:1px solid rgba(0,170,255,.17);border-radius:9px;padding:22px;width:450px;max-width:93vw;box-shadow:0 0 50px rgba(0,170,255,.06);}
.mt{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;color:var(--blue);letter-spacing:4px;margin-bottom:3px;}
.ms{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.26);letter-spacing:1.5px;margin-bottom:15px;}
.mb label{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.33);letter-spacing:2px;display:block;margin-bottom:4px;margin-top:11px;}
.mb input,.mb textarea{width:100%;background:rgba(0,170,255,.03);border:1px solid rgba(0,170,255,.11);border-radius:4px;padding:8px 11px;color:var(--bright);font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;caret-color:var(--blue);}
.mb input:focus,.mb textarea:focus{border-color:rgba(0,170,255,.28);}
.mb textarea{resize:vertical;min-height:85px;max-height:155px;}
.mbtns{display:flex;gap:7px;margin-top:15px;justify-content:flex-end;}
.bc{padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;}
.bc:hover{border-color:rgba(0,170,255,.18);}
.bk{padding:7px 15px;background:rgba(0,170,255,.08);border:1px solid rgba(0,170,255,.25);border-radius:4px;color:var(--blue);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;}
.bk:hover{background:rgba(0,170,255,.15);}

/* MEMORY */
.mem-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.15);border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,255,136,.6);letter-spacing:1px;margin-bottom:5px;}
.mem-section{padding:8px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,.2);}
.mem-title{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,255,136,.4);letter-spacing:2px;margin-bottom:6px;}
.mem-item{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(0,255,136,.04);border:1px solid rgba(0,255,136,.1);border-radius:4px;margin-bottom:3px;font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(0,200,100,.6);}
.mem-del{cursor:pointer;color:rgba(255,50,50,.4);font-size:10px;}
.mem-del:hover{color:rgba(255,50,50,.7);}
.web-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;background:rgba(0,170,255,.05);border:1px solid rgba(0,170,255,.15);border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.5);letter-spacing:1px;margin-bottom:5px;}

/* EDIT MESSAGE */
.edit-area{width:100%;background:rgba(0,170,255,.04);border:1px solid rgba(0,170,255,.2);border-radius:5px;padding:7px 10px;color:var(--bright);font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;caret-color:var(--blue);resize:vertical;min-height:50px;margin-top:4px;}
.edit-btns{display:flex;gap:5px;margin-top:5px;justify-content:flex-end;}
.edit-save{padding:4px 10px;background:rgba(0,170,255,.1);border:1px solid rgba(0,170,255,.25);border-radius:3px;color:var(--blue);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:1px;}
.edit-cancel{padding:4px 10px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:1px;}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div class="grid"></div><div class="vign"></div><div class="scan"></div>
<div class="co tl"></div><div class="co tr"></div><div class="co bl"></div><div class="co br"></div>

<div class="app">
  <aside class="sidebar">
    <div class="sb-logo-area">
      <div class="sb-logo">NEXUS<span style="font-size:9px;color:rgba(0,170,255,.5);letter-spacing:3px;margin-left:3px">AI</span></div>
      <div class="sb-sub">SEGUNDO CEREBRO ARTIFICIAL</div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tabA" onclick="switchTab('agents')">AGENTES</div>

<script>
// BG
const bgc=document.getElementById('bgc'),bgx=bgc.getContext('2d');
let W,H;function rsz(){W=bgc.width=window.innerWidth;H=bgc.height=window.innerHeight;}
rsz();window.addEventListener('resize',rsz);
const BC=['#003388','#0055aa','#0077cc','#0099ee','#00bbff'];
class BP{constructor(){this.r(true);}r(i){const a=Math.random()*Math.PI*2,r=40+Math.random()*150;this.x=W/2+Math.cos(a)*r+(Math.random()-.5)*70;this.y=H/2+Math.sin(a)*r+(Math.random()-.5)*70;this.vx=(Math.random()-.5)*.2;this.vy=(Math.random()-.5)*.2-.1;this.l=i?Math.random():0;this.ml=.6+Math.random()*1.1;this.sz=.3+Math.random()*1.2;this.c=BC[0|Math.random()*BC.length];this.ob=Math.random()<.4;this.or=35+Math.random()*120;this.os=(.002+Math.random()*.004)*(Math.random()<.5?1:-1);this.oa=Math.random()*Math.PI*2;}step(){this.l+=.005;if(this.ob){this.oa+=this.os;this.x=W/2+Math.cos(this.oa)*this.or;this.y=H/2+Math.sin(this.oa)*this.or;}else{this.x+=this.vx;this.y+=this.vy;}if(this.l>this.ml)this.r(false);}draw(){bgx.globalAlpha=Math.sin((this.l/this.ml)*Math.PI)*.38;bgx.beginPath();bgx.arc(this.x,this.y,this.sz,0,Math.PI*2);bgx.fillStyle=this.c;bgx.shadowBlur=5;bgx.shadowColor=this.c;bgx.fill();bgx.shadowBlur=0;}}
const bps=[];for(let i=0;i<180;i++)bps.push(new BP());
(function df(){requestAnimationFrame(df);bgx.clearRect(0,0,W,H);const g=bgx.createRadialGradient(W/2,H/2,0,W/2,H/2,180);g.addColorStop(0,'rgba(0,80,180,.04)');g.addColorStop(.6,'rgba(0,40,120,.015)');g.addColorStop(1,'transparent');bgx.globalAlpha=1;bgx.fillStyle=g;bgx.fillRect(0,0,W,H);bgx.globalAlpha=.06;bgx.strokeStyle='#0066cc';bgx.lineWidth=.28;[45,85,130,170].forEach(r=>{bgx.beginPath();bgx.arc(W/2,H/2,r,0,Math.PI*2);bgx.stroke();});bgx.lineWidth=.18;for(let i=0;i<bps.length;i++)for(let j=i+1;j<bps.length;j++){const dx=bps[i].x-bps[j].x,dy=bps[i].y-bps[j].y,d=Math.hypot(dx,dy);if(d<48){bgx.globalAlpha=(1-d/48)*.09;bgx.strokeStyle='#0088ff';bgx.beginPath();bgx.moveTo(bps[i].x,bps[i].y);bgx.lineTo(bps[j].x,bps[j].y);bgx.stroke();}}bps.forEach(p=>{p.step();p.draw();});bgx.globalAlpha=1;})();

// BRAIN CANVAS
let brainRaf=null;
function drawBrain(id,sz){
  const c=document.getElementById(id);if(!c)return;
  c.width=sz;c.height=sz;const x=c.getContext('2d');
  const nn=[];for(let i=0;i<22;i++)nn.push({x:8+Math.random()*(sz-16),y:8+Math.random()*(sz-16),vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:.6+Math.random()*2,p:Math.random()*Math.PI*2,sp:.022+Math.random()*.028});
  if(brainRaf)cancelAnimationFrame(brainRaf);
  (function loop(){brainRaf=requestAnimationFrame(loop);x.clearRect(0,0,sz,sz);const g=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);g.addColorStop(0,'rgba(0,100,200,.06)');g.addColorStop(1,'transparent');x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,0,sz,sz);x.lineWidth=.32;for(let i=0;i<nn.length;i++)for(let j=i+1;j<nn.length;j++){const dx=nn[i].x-nn[j].x,dy=nn[i].y-nn[j].y,d=Math.hypot(dx,dy);if(d<48){x.globalAlpha=(1-d/48)*.3;x.strokeStyle='#0088ff';x.beginPath();x.moveTo(nn[i].x,nn[i].y);x.lineTo(nn[j].x,nn[j].y);x.stroke();}}nn.forEach(n=>{n.p+=n.sp;x.globalAlpha=.32+Math.sin(n.p)*.25;x.beginPath();x.arc(n.x,n.y,n.r,0,Math.PI*2);x.fillStyle='#00aaff';x.shadowBlur=6;x.shadowColor='#0088ff';x.fill();x.shadowBlur=0;n.x+=n.vx;n.y+=n.vy;if(n.x<4||n.x>sz-4)n.vx*=-1;if(n.y<4||n.y>sz-4)n.vy*=-1;});x.globalAlpha=1;})();
}

(function tick(){const n=new Date(),p=v=>String(v).padStart(2,'0');document.getElementById('clk').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;const D=['DOM','SEG','TER','QUA','QUI','SEX','SAB'],M=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];document.getElementById('dt').textContent=`${D[n.getDay()]} ${n.getDate()} ${M[n.getMonth()]} ${n.getFullYear()}`;setTimeout(tick,1000);})();

// TEXTAREA AUTO RESIZE
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}

// MARKDOWN RENDERER
function renderMD(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>`<pre><code class="lang-${lang}">${code.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^\> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^\* (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/s,s=>`<ul>${s}</ul>`)
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')
    .replace(/^(?!<[h|u|o|l|p|b|h])/gm,'');
}

// DETECT ARTIFACT
function detectArtifact(text){
  const htmlMatch=text.match(/```html\n?([\s\S]+?)```/);
  if(htmlMatch)return{type:'html',code:htmlMatch[1].trim(),lang:'HTML'};
  const codeMatch=text.match(/```(\w+)\n?([\s\S]+?)```/);
  if(codeMatch)return{type:'code',code:codeMatch[2].trim(),lang:codeMatch[1]};
  return null;
}

// STATE
let agents=JSON.parse(localStorage.getItem('nx_agents')||'[]');
let agentChats=JSON.parse(localStorage.getItem('nx_agent_chats')||'{}');
let freeChats=JSON.parse(localStorage.getItem('nx_free_chats')||'[]');
let activeAgent=null;
let activeFreeChatId=null;
let currentMode='none';
let busy=false;
let voiceTriggered=false;
let pendingFiles=[];

function saveAll(){
  localStorage.setItem('nx_agents',JSON.stringify(agents));
  localStorage.setItem('nx_agent_chats',JSON.stringify(agentChats));
  localStorage.setItem('nx_free_chats',JSON.stringify(freeChats));
}

// TABS
function switchTab(t){
  document.getElementById('tabA').className='tab'+(t==='agents'?' active':'');
  document.getElementById('tabC').className='tab'+(t==='chats'?' active':'');

// AGENTS
function renderAgents(){
  const list=document.getElementById('agentsList');list.innerHTML='';
  if(!agents.length){list.innerHTML='<div class="empty-st">NENHUM AGENTE<br>CRIADO AINDA<br><br>CLIQUE EM<br>+ NOVO AGENTE</div>';return;}

    const d=document.createElement('div');

}

function selectAgent(a){
  activeAgent=a;activeFreeChatId=null;currentMode='agent';
  document.getElementById('mhName').textContent=a.name;
  document.getElementById('mhStatus').textContent=a.desc.slice(0,55);

}

function delAgent(id,e){e.stopPropagation();if(!confirm('Deletar agente?'))return;agents=agents.filter(a=>a.id!==id);delete agentChats[id];saveAll();if(activeAgent&&activeAgent.id===id){activeAgent=null;currentMode='none';resetHeader();}renderAgents();}

// FREE CHATS
function newFreeChat(){
  const id='fc_'+Date.now();
  const title='CHAT '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  freeChats.unshift({id,title,messages:[],createdAt:new Date().toISOString()});
  saveAll();activeFreeChatId=id;activeAgent=null;currentMode='free';
  resetHeader();renderFreeChats();renderChatArea();switchTab('chats');
  document.getElementById('mhActions').style.display='flex';
}

function renderFreeChats(){
  const el=document.getElementById('chatsItems');el.innerHTML='';
  if(!freeChats.length){el.innerHTML='<div class="empty-st" style="padding:10px">NENHUMA CONVERSA<br>AINDA</div>';return;}
  freeChats.forEach(c=>{
    const d=document.createElement('div');
    d.className='chat-item'+(c.id===activeFreeChatId&&currentMode==='free'?' sel':'');
    const last=c.messages.length?c.messages[c.messages.length-1].content.slice(0,38)+'...':'';
    const date=c.createdAt?new Date(c.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    d.innerHTML=`<div class="ci-title">${c.title}</div><div class="ci-preview">${last}</div><div class="ci-meta"><span class="ci-date">${date}</span><span class="ci-count">${c.messages.length} msgs</span></div><button class="item-del" onclick="delFreeChat('${c.id}',event)">x</button>`;
    d.onclick=()=>selectFreeChat(c.id);el.appendChild(d);
  });
}

function selectFreeChat(id){
  activeFreeChatId=id;activeAgent=null;currentMode='free';
  resetHeader();renderFreeChats();renderAgents();renderChatArea();
  document.getElementById('mhActions').style.display='flex';
}

function delFreeChat(id,e){e.stopPropagation();if(!confirm('Deletar conversa?'))return;freeChats=freeChats.filter(c=>c.id!==id);saveAll();if(activeFreeChatId===id){activeFreeChatId=null;currentMode='none';showWelcome();document.getElementById('mhActions').style.display='none';}renderFreeChats();}

function resetHeader(){
  document.getElementById('mhName').textContent='NEXUS AI';
  document.getElementById('mhStatus').textContent='SEGUNDO CEREBRO ARTIFICIAL';
  document.getElementById('typAv').textContent='NXS';
  document.getElementById('inp').placeholder='Digite seu pensamento...';
}

// CHAT ACTIONS
function clearChat(){
  if(!confirm('Limpar esta conversa?'))return;
  if(currentMode==='agent'&&activeAgent)agentChats[activeAgent.id]=[];
  else if(currentMode==='free'&&activeFreeChatId){const fc=freeChats.find(c=>c.id===activeFreeChatId);if(fc)fc.messages=[];}
  saveAll();renderChatArea();
}

function exportChat(){
  let msgs=[];
  if(currentMode==='agent'&&activeAgent)msgs=agentChats[activeAgent.id]||[];
  else if(currentMode==='free'&&activeFreeChatId){const fc=freeChats.find(c=>c.id===activeFreeChatId);msgs=fc?fc.messages:[];}
  if(!msgs.length){alert('Nenhuma mensagem para exportar.');return;}
  const txt=msgs.map(m=>`[${m.role.toUpperCase()}]\n${m.content}`).join('\n\n---\n\n');
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`nexus-chat-${Date.now()}.txt`;a.click();
}

function regenerateLast(){
  let msgs=[];
  if(currentMode==='agent'&&activeAgent)msgs=agentChats[activeAgent.id]||[];
  else if(currentMode==='free'&&activeFreeChatId){const fc=freeChats.find(c=>c.id===activeFreeChatId);msgs=fc?fc.messages:[];}
  if(!msgs.length)return;
  // Remove last assistant message
  const lastAss=msgs.map((m,i)=>({m,i})).filter(x=>x.m.role==='assistant').pop();
  if(!lastAss)return;
  msgs.splice(lastAss.i,1);
  if(currentMode==='agent'&&activeAgent)agentChats[activeAgent.id]=msgs;
  else if(currentMode==='free'&&activeFreeChatId){const fc=freeChats.find(c=>c.id===activeFreeChatId);if(fc)fc.messages=msgs;}
  saveAll();renderChatArea();
  // Resend
  const lastUser=msgs.filter(m=>m.role==='user').pop();
  if(lastUser){document.getElementById('inp').value=lastUser.content;send();}
}

// FILE HANDLING
function handleFiles(files){
  Array.from(files).forEach(f=>{
    pendingFiles.push(f);
    const chip=document.createElement('div');chip.className='file-chip';chip.dataset.name=f.name;
    chip.innerHTML=`<span>${f.name.slice(0,20)}</span><span class="file-chip-del" onclick="removeFile('${f.name}',this)">x</span>`;
    document.getElementById('filePreviewArea').appendChild(chip);
  });
  document.getElementById('fileInput').value='';
}

function removeFile(name,el){
  pendingFiles=pendingFiles.filter(f=>f.name!==name);
  el.closest('.file-chip').remove();
}

async function readFiles(){
  const results=[];
  for(const f of pendingFiles){
    if(f.type.startsWith('image/')){
      const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result.split(',')[1]);fr.readAsDataURL(f);});
      results.push({type:'image',name:f.name,b64,mimeType:f.type});
    } else {
      const text=await f.text();
      results.push({type:'text',name:f.name,content:text.slice(0,8000)});
    }
  }
  return results;
}

// CHAT AREA RENDER
function renderChatArea(){
  const ca=document.getElementById('chatArea');ca.innerHTML='';

function addMsgEl(role,content,idx){
  const ca=document.getElementById('chatArea');
  const w=ca.querySelector('.welcome');if(w)w.remove();
  const isJ=role==='assistant';
  const wrap=document.createElement('div');wrap.className='msg '+(isJ?'j':'u');

  const av=document.createElement('div');av.className='av '+(isJ?'j':'u');
  av.textContent=isJ?(activeAgent?.name?.slice(0,3)||'NXS'):'GUI';

  const col=document.createElement('div');col.style.flex='1';col.style.minWidth='0';

  const lbl=document.createElement('div');lbl.className='msg-lbl';
  lbl.textContent=isJ?(activeAgent?.name||'NEXUS'):'GUI';

  const bub=document.createElement('div');bub.className='bub';
  bub.innerHTML=renderMD(content);

  // Artifact detection
  const art=detectArtifact(content);
  if(art){
    const ab=document.createElement('div');ab.className='artifact-block';
    ab.innerHTML=`<div class="artifact-header"><span class="artifact-title">ARTIFACT — ${art.lang.toUpperCase()}</span><div class="artifact-actions"><button class="art-btn" onclick="copyArtifact(this)">COPIAR</button>${art.type==='html'?`<button class="art-btn" onclick="togglePreview(this)">PREVIEW</button>`:''}</div></div>`;
    if(art.type==='html'){
      const iframe=document.createElement('iframe');iframe.className='artifact-preview';iframe.sandbox='allow-scripts';
      const body=document.createElement('div');body.className='artifact-body';body.textContent=art.code;
      ab.appendChild(body);ab.appendChild(iframe);
      ab.querySelector('.art-btn:last-child').dataset.code=art.code;
    } else {
      const body=document.createElement('div');body.className='artifact-body';body.textContent=art.code;ab.appendChild(body);
    }
    ab.dataset.code=art.code;bub.appendChild(ab);
  }

  // Actions
  const acts=document.createElement('div');acts.className='msg-actions';
  const copyBtn=document.createElement('button');copyBtn.className='ma-btn';copyBtn.textContent='COPIAR';
  copyBtn.onclick=()=>{navigator.clipboard.writeText(content);copyBtn.textContent='COPIADO';copyBtn.classList.add('copied');setTimeout(()=>{copyBtn.textContent='COPIAR';copyBtn.classList.remove('copied');},1500);};

  if(!isJ){
    const editBtn=document.createElement('button');editBtn.className='ma-btn';editBtn.textContent='EDITAR';
    editBtn.onclick=()=>startEdit(wrap,content,idx);
    acts.appendChild(editBtn);
  } else {
    const regenBtn=document.createElement('button');regenBtn.className='ma-btn';regenBtn.textContent='REGENERAR';
    regenBtn.onclick=()=>regenFrom(idx);
    acts.appendChild(regenBtn);
  }
  acts.appendChild(copyBtn);

  col.appendChild(lbl);col.appendChild(bub);col.appendChild(acts);
  wrap.appendChild(av);wrap.appendChild(col);
  ca.appendChild(wrap);ca.scrollTop=9999;
}

function startEdit(wrap,content,idx){

}

function cancelEdit(btn,orig){btn.closest('.bub').innerHTML=decodeURIComponent(orig);}

function saveEdit(btn,idx){
  const newText=btn.closest('.bub').querySelector('.edit-area').value.trim();
  if(!newText)return;
  let msgs=getMsgs();
  msgs=msgs.slice(0,idx);

}

function regenFrom(idx){
  let msgs=getMsgs();
  msgs=msgs.slice(0,idx);
  setMsgs(msgs);saveAll();renderChatArea();
  const lastUser=msgs.filter(m=>m.role==='user').pop();
  if(lastUser){document.getElementById('inp').value=lastUser.content;send();}
}

function getMsgs(){
  if(currentMode==='agent'&&activeAgent)return agentChats[activeAgent.id]||[];
  if(currentMode==='free'&&activeFreeChatId){const fc=freeChats.find(c=>c.id===activeFreeChatId);return fc?fc.messages:[];}

}

function setMsgs(msgs){
  if(currentMode==='agent'&&activeAgent)agentChats[activeAgent.id]=msgs;
  else if(currentMode==='free'&&activeFreeChatId){const fc=freeChats.find(c=>c.id===activeFreeChatId);if(fc)fc.messages=msgs;}

function pushMsg(role,content){
  const msgs=getMsgs();msgs.push({role,content});setMsgs(msgs);

// VOICE SYSTEM
const WAKE_WORDS=['ei nexus','oi nexus','hey nexus','nexus','e nexus'];
let wakeActive=false,wakeRecog=null,cmdRecog=null,isSpeaking=false,bestVoice=null;

function loadVoices(){
  const try_=()=>{
    const vs=window.speechSynthesis.getVoices();if(!vs.length){setTimeout(try_,100);return;}
    const pri=[v=>v.name.includes('Luciana'),v=>v.name.includes('Google')&&v.lang==='pt-BR',v=>v.lang==='pt-BR',v=>v.lang.startsWith('pt')];
    for(const t of pri){const v=vs.find(t);if(v){bestVoice=v;break;}}
  };
  if(window.speechSynthesis.getVoices().length)try_();else window.speechSynthesis.onvoiceschanged=try_;
}
loadVoices();

function speak(text,onDone){
  if(!window.speechSynthesis){if(onDone)onDone();return;}
  window.speechSynthesis.cancel();
  const clean=text.replace(/\*\*(.*?)\*\*/g,'$1').replace(/\*(.*?)\*/g,'$1').replace(/[#\n`]/g,' ').replace(/\s+/g,' ').trim().slice(0,500);
  const u=new SpeechSynthesisUtterance(clean);
  if(bestVoice)u.voice=bestVoice;
  u.lang='pt-BR';u.rate=0.9;u.pitch=1.0;u.volume=1.0;
  isSpeaking=true;
  const done=()=>{isSpeaking=false;if(onDone)onDone();if(wakeActive)setTimeout(startWakeListen,300);};
  u.onend=done;u.onerror=done;
  window.speechSynthesis.speak(u);
}

function beep(){try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(660,ac.currentTime);o.frequency.exponentialRampToValueAtTime(880,ac.currentTime+.12);g.gain.setValueAtTime(.14,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.start();o.stop(ac.currentTime+.2);}catch(e){}}

function toggleMic(){
  if(wakeActive){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setVst('USE GOOGLE CHROME','#ff4444');return;}
  navigator.mediaDevices.getUserMedia({audio:true})
    .then(s=>{s.getTracks().forEach(t=>t.stop());startVoice();})
    .catch(()=>setVst('PERMISSAO NEGADA — VERIFIQUE O CHROME','#ff4444'));
}

function startVoice(){
  wakeActive=true;setMicUI('wake');
  setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');
  speak('Sistema de voz ativo.',()=>startWakeListen());
}

function stopVoice(){
  wakeActive=false;
  try{wakeRecog&&wakeRecog.abort();}catch(e){}
  try{cmdRecog&&cmdRecog.abort();}catch(e){}
  window.speechSynthesis.cancel();isSpeaking=false;
  setMicUI('off');setWF(false);setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');
}

function startWakeListen(){
  if(!wakeActive||isSpeaking)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  wakeRecog=new SR();wakeRecog.lang='pt-BR';wakeRecog.continuous=false;wakeRecog.interimResults=false;wakeRecog.maxAlternatives=5;
  wakeRecog.onresult=e=>{
    if(!wakeActive)return;
    const alts=Array.from(e.results[0]).map(a=>a.transcript.toLowerCase().trim());
    if(alts.some(t=>WAKE_WORDS.some(w=>t.includes(w)))){onWake();}else resumeWake();
  };
  wakeRecog.onerror=e=>{if(e.error!=='aborted'&&wakeActive)setTimeout(resumeWake,500);};
  wakeRecog.onend=()=>{if(wakeActive&&!isSpeaking)resumeWake();};
  try{wakeRecog.start();}catch(e){setTimeout(resumeWake,400);}
}

function resumeWake(){
  if(!wakeActive||isSpeaking)return;
  try{wakeRecog&&wakeRecog.abort();}catch(e){}
  setTimeout(()=>{if(wakeActive&&!isSpeaking)startWakeListen();},260);
}

function onWake(){setMicUI('listening');setVst('OUVINDO...','#00aaff');setWF(true);beep();setTimeout(startCmdListen,380);}

function startCmdListen(){
  if(!wakeActive)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  let got=false;
  cmdRecog=new SR();cmdRecog.lang='pt-BR';cmdRecog.continuous=false;cmdRecog.interimResults=false;cmdRecog.maxAlternatives=3;
  cmdRecog.onresult=e=>{
    got=true;const cmd=e.results[0][0].transcript.trim();
    if(cmd.length<2){resumeWake();return;}
    document.getElementById('inp').value=cmd;setMicUI('proc');setWF(false);setVst('PROCESSANDO...','#ffaa00');
    voiceTriggered=true;send();
  };
  cmdRecog.onerror=()=>{if(!got){setMicUI('wake');setWF(false);setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');resumeWake();}};
  cmdRecog.onend=()=>{if(!got){setMicUI('wake');setWF(false);resumeWake();}};
  try{cmdRecog.start();}catch(e){setMicUI('wake');resumeWake();}
}

function setMicUI(s){
  const b=document.getElementById('vbtn');
  if(s==='off'){b.className='';b.textContent='MIC';}
  else if(s==='wake'){b.className='';b.style.cssText='';b.textContent='MIC';}
  else if(s==='listening'){b.className='active';b.textContent='OUV';}
  else if(s==='proc'){b.className='';b.textContent='PROC';}
}

function setVst(msg,col){const el=document.getElementById('vst');el.textContent=msg;el.style.color=col||'rgba(0,170,255,.2)';}

// MEMORY SYSTEM
let memories = JSON.parse(localStorage.getItem('nx_memory') || '[]');
function saveMemory(){localStorage.setItem('nx_memory',JSON.stringify(memories));}

function openMemModal(){
  document.getElementById('memModal').style.display='flex';
  renderMemList();
}
function closeMemModal(){document.getElementById('memModal').style.display='none';}

function renderMemList(){
  const el=document.getElementById('memList');
  if(!memories.length){el.innerHTML='<div style="font-family:Share Tech Mono,monospace;font-size:8px;color:rgba(0,255,136,.25);text-align:center;padding:12px">NENHUMA MEMORIA SALVA</div>';return;}
  el.innerHTML=memories.map((m,i)=>`<div class="mem-item"><span>${m.slice(0,60)}${m.length>60?'...':''}</span><span class="mem-del" onclick="delMemory(${i})">x</span></div>`).join('');
}

function addMemory(){
  const v=document.getElementById('memInput').value.trim();
  if(!v)return;
  memories.unshift(v);
  if(memories.length>30)memories=memories.slice(0,30);
  saveMemory();renderMemList();
  document.getElementById('memInput').value='';
}

function delMemory(i){memories.splice(i,1);saveMemory();renderMemList();}

function getMemoryContext(){
  if(!memories.length)return'';
  return'\n\nMEMORIAS SOBRE O USUARIO:\n'+memories.map(m=>'- '+m).join('\n');
}

// WEB SEARCH via API
async function webSearch(query){
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[],command:{type:'search',query}})});
    const d=await r.json();
    return d.content?.[0]?.text||null;
  }catch(e){return null;}
}

function needsWebSearch(text){
  return /hoje|agora|atual|recente|ultimo|noticias|preco|cotacao|tempo|clima|quando foi|quem e|2024|2025|2026/i.test(text)
    && !/que horas|que dia|previsao/i.test(text);
}

// SEND
async function send(){
  if(busy)return;
  const el=document.getElementById('inp'),text=el.value.trim();
  const hasFiles=pendingFiles.length>0;
  if(!text&&!hasFiles)return;
  if(currentMode==='none'){alert('Selecione um agente ou inicie um novo chat!');return;}

  const fromVoice=voiceTriggered;voiceTriggered=false;
  el.value='';el.style.height='auto';busy=true;document.getElementById('sbtn').disabled=true;

  // Read files
  let fileContents=[];
  if(hasFiles){
    fileContents=await readFiles();
    pendingFiles=[];document.getElementById('filePreviewArea').innerHTML='';
  }

  // Build user message with files
  let fullMsg=text;
  fileContents.forEach(f=>{
    if(f.type==='text')fullMsg+=`\n\n[ARQUIVO: ${f.name}]\n${f.content}`;
    else if(f.type==='image')fullMsg+=`\n\n[IMAGEM: ${f.name}]`;
  });

  // LOCAL COMMANDS
  if(/que horas|horas sao|hora certa/i.test(text)){
    const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
    const r=`Sao ${h}h${m}, Gui.`;
    pushMsg('user',text);pushMsg('assistant',r);
    if(fromVoice)speak(r,()=>{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}});
    else if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}
    else setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');
    busy=false;document.getElementById('sbtn').disabled=false;el.focus();return;
  }

  if(/que dia|data de hoje|dia e hoje/i.test(text)){
    const n=new Date();const D=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];const M=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const r=`Hoje e ${D[n.getDay()]}, ${n.getDate()} de ${M[n.getMonth()]} de ${n.getFullYear()}.`;
    pushMsg('user',text);pushMsg('assistant',r);
    if(fromVoice)speak(r,()=>{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}});
    else if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}
    else setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');
    busy=false;document.getElementById('sbtn').disabled=false;el.focus();return;
  }

  const wm=text.match(/(?:previsao|tempo|clima).*?(?:em|de|para|na?)\s+([a-zA-Z\s]+?)(?:\?|$)/i);
  if(wm||/previsao do tempo|como esta o tempo|vai chover|temperatura/i.test(text)){
    let city=(wm&&wm[1])||'';city=city.trim()||'Porto Alegre';
    pushMsg('user',text);setTyp(true);
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[],command:{type:'weather',city}})});
      const d=await r.json();const rep=d.content[0].text;
      setTyp(false);pushMsg('assistant',rep);
      if(fromVoice)speak(rep,()=>{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}});
      else if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}
      else setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');
    }catch(e){setTyp(false);pushMsg('assistant','Erro ao consultar clima.');}
    busy=false;document.getElementById('sbtn').disabled=false;el.focus();return;
  }

  // AI
  pushMsg('user',fullMsg);setTyp(true);setVst('PROCESSANDO...','#0088ff');

  // Web search if needed
  let searchResult='';
  if(needsWebSearch(text)){
    setVst('BUSCANDO NA WEB...','#00aaff');
    const sr=await webSearch(text);
    if(sr)searchResult='\n\n[RESULTADO DE BUSCA NA WEB]:\n'+sr;
  }

  const memCtx=getMemoryContext();
  const baseInstr=activeAgent?activeAgent.instr:`Voce e NEXUS AI, um assistente de IA pessoal sofisticado e inteligente de Gui, editor de video profissional. Responda em portugues brasileiro. Seja direto, preciso e util. Use markdown para formatar respostas longas com titulos, listas e codigo quando necessario.`;
  const sysPrompt=baseInstr+memCtx;
  const hist=getMsgs().slice(-20);

  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,agentInstr:sysPrompt,searchResult})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    const rep=d.content[0].text;
    setTyp(false);
    const finalRep=(searchResult?'<div class="web-badge">NEXUS WEB</div>\n':'')+rep;
    pushMsg('assistant',rep);
    if(fromVoice)speak(rep,()=>{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}});
    else{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}else setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');}
  }catch(e){
    setTyp(false);pushMsg('assistant','Erro: '+e.message);setVst('ERRO DE CONEXAO','#ff4444');
    if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.55)');}
  }
  busy=false;document.getElementById('sbtn').disabled=false;el.focus();
}

function sc(t){
  if(currentMode==='none'){newFreeChat();}
  document.getElementById('inp').value=t;send();
}
