<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap');
:root{
  --blue:#00aaff;--blue-dim:#00aaff20;--blue-glow:#00aaff55;
  --cyan:#00d4ff;--purple:#6644ff;
  --bg:#020810;--border:#0a2035;--text:#7ab8d4;--bright:#d0eeff;--muted:rgba(120,180,210,.38);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);height:100vh;overflow:hidden;}
#bgc{position:fixed;inset:0;z-index:0;pointer-events:none;}
.grid{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(0,170,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,170,255,.015) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;}
.vign{position:fixed;inset:0;z-index:2;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.92) 100%);pointer-events:none;}
.scan{position:fixed;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.18),transparent);animation:sc 10s linear infinite;pointer-events:none;z-index:999;}
@keyframes sc{0%{top:0;opacity:0}4%{opacity:1}96%{opacity:.28}100%{top:100vh;opacity:0}}
.co{position:fixed;width:20px;height:20px;border-color:rgba(0,170,255,.28);border-style:solid;pointer-events:none;z-index:999;}
.tl{top:10px;left:10px;border-width:1px 0 0 1px}.tr{top:10px;right:10px;border-width:1px 1px 0 0}
.bl{bottom:10px;left:10px;border-width:0 0 1px 1px}.br{bottom:10px;right:10px;border-width:0 1px 1px 0}

/* LAYOUT */
.app{position:relative;z-index:10;display:grid;grid-template-columns:210px 1fr;height:100vh;}

/* SIDEBAR */
.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(2,8,16,.97);overflow:hidden;}

.sb-logo-area{padding:18px 14px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-logo{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;color:var(--blue);letter-spacing:6px;text-shadow:0 0 18px var(--blue-glow);animation:lp 5s ease-in-out infinite;}
@keyframes lp{0%,100%{text-shadow:0 0 18px var(--blue-glow)}50%{text-shadow:0 0 35px var(--blue),0 0 70px var(--blue-glow)}}
.sb-sub{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.3);letter-spacing:2px;margin-top:3px;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:10px 0;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;color:rgba(0,170,255,.35);text-align:center;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;}
.tab:hover{color:rgba(0,170,255,.6);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* TAB PANELS */
.tab-panel{display:none;flex-direction:column;flex:1;overflow:hidden;}
.tab-panel.active{display:flex;}

/* NEW BUTTON */
.new-btn{margin:10px 12px 8px;padding:9px;background:rgba(0,170,255,.06);border:1px solid rgba(0,170,255,.18);border-radius:5px;color:var(--blue);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;transition:all .2s;flex-shrink:0;}
.new-btn:hover{background:rgba(0,170,255,.12);}

/* SCROLL LIST */
.scroll-list{flex:1;overflow-y:auto;padding:4px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--blue-dim) transparent;}
.scroll-list::-webkit-scrollbar{width:3px;}.scroll-list::-webkit-scrollbar-thumb{background:var(--blue-dim);}

/* AGENT ITEM */
.agent-item{padding:10px 11px;border-radius:5px;cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:5px;position:relative;}
.agent-item:hover{background:var(--blue-dim);border-color:rgba(0,170,255,.14);}
.agent-item.sel{background:rgba(0,170,255,.07);border-color:rgba(0,170,255,.22);}
.agent-item.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--blue),var(--purple));border-radius:2px 0 0 2px;}
.ai-name{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:var(--blue);letter-spacing:1px;margin-bottom:3px;}
.ai-desc{font-size:9px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.item-del{position:absolute;top:7px;right:7px;width:16px;height:16px;border:none;background:transparent;color:rgba(0,170,255,.2);cursor:pointer;font-size:10px;display:none;align-items:center;justify-content:center;}
.agent-item:hover .item-del,.chat-item:hover .item-del{display:flex;}
.item-del:hover{color:rgba(255,50,50,.6);}

/* CHAT ITEM */
.chat-item{padding:9px 11px;border-radius:5px;cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:4px;position:relative;}
.chat-item:hover{background:var(--blue-dim);border-color:rgba(0,170,255,.12);}
.chat-item.sel{background:rgba(0,170,255,.06);border-color:rgba(0,170,255,.18);}
.chat-item.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cyan);border-radius:2px 0 0 2px;}
.ci-title{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.ci-meta{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.22);margin-top:2px;}

.empty-state{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(0,170,255,.18);text-align:center;padding:20px 10px;line-height:2;letter-spacing:1px;}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;}
.mh{border-bottom:1px solid var(--border);padding:0 20px;height:50px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,8,16,.97);flex-shrink:0;position:relative;}
.mh::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),var(--blue),transparent);animation:hl 4s ease-in-out infinite;}
@keyframes hl{0%,100%{opacity:.18}50%{opacity:.55}}
.mh-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 7px var(--blue);animation:pd 2s ease-in-out infinite;flex-shrink:0;}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.2}}
.mh-name{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--blue);letter-spacing:3px;}
.mh-status{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.32);letter-spacing:1px;}
#clk{font-family:'Orbitron',monospace;font-size:12px;color:var(--blue);letter-spacing:1px;}
#dt{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.26);}

/* CHAT AREA */
.chat-area{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:13px;scrollbar-width:thin;scrollbar-color:var(--blue-dim) transparent;}
.chat-area::-webkit-scrollbar{width:3px;}.chat-area::-webkit-scrollbar-thumb{background:var(--blue-dim);}

/* WELCOME */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;text-align:center;}
.brain-wrap{position:relative;width:160px;height:160px;}
#bc2{width:160px;height:160px;}
.w-title{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--blue);letter-spacing:5px;text-shadow:0 0 25px var(--blue-glow);}
.w-sub{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(0,170,255,.3);letter-spacing:2px;line-height:2;}
.qcs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.qc{padding:4px 11px;background:var(--blue-dim);border:1px solid rgba(0,170,255,.14);border-radius:14px;font-size:8px;color:rgba(0,170,255,.45);cursor:pointer;transition:all .2s;font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
.qc:hover{background:rgba(0,170,255,.1);color:var(--blue);}

/* MESSAGES */
.msg{display:flex;gap:9px;animation:mi .22s ease;}
@keyframes mi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}
.msg.j{align-self:flex-start;max-width:88%;}
.av{width:28px;height:28px;border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:7px;}
.av.j{background:rgba(0,170,255,.1);border:1px solid rgba(0,170,255,.18);color:var(--blue);}
.av.u{background:rgba(100,68,255,.09);border:1px solid rgba(100,68,255,.16);color:var(--purple);}
.bub{padding:8px 12px;border-radius:5px;font-size:13px;line-height:1.65;position:relative;}
.msg.j .bub{background:rgba(0,170,255,.04);border:1px solid rgba(0,170,255,.09);color:var(--bright);border-top-left-radius:0;}
.msg.j .bub::before{content:'';position:absolute;top:0;left:-1px;bottom:0;width:2px;background:linear-gradient(180deg,var(--blue),var(--purple));border-radius:1px;}
.msg.u .bub{background:rgba(100,68,255,.07);border:1px solid rgba(100,68,255,.12);color:var(--bright);border-top-right-radius:0;}
.msg-lbl{font-family:'Share Tech Mono',monospace;font-size:6px;letter-spacing:1.5px;margin-bottom:3px;opacity:.32;}
.msg.j .msg-lbl{color:var(--blue)}.msg.u .msg-lbl{color:var(--purple);text-align:right;}

.typing{display:none;align-self:flex-start;gap:9px;align-items:center;}
.typing.on{display:flex;}
.tdots{display:flex;gap:4px;padding:8px 12px;background:rgba(0,170,255,.035);border:1px solid rgba(0,170,255,.08);border-radius:5px;border-top-left-radius:0;}
.td{width:4px;height:4px;border-radius:50%;background:var(--blue);animation:tda 1.2s ease-in-out infinite;}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tda{0%,60%,100%{transform:translateY(0);opacity:.28}30%{transform:translateY(-5px);opacity:1}}

/* INPUT */
.inz{border-top:1px solid var(--border);padding:11px 20px;display:flex;flex-direction:column;gap:5px;background:rgba(2,8,16,.97);flex-shrink:0;}
.inz-row{display:flex;gap:7px;align-items:center;}
#vbtn{width:38px;height:38px;border-radius:5px;border:1px solid rgba(0,170,255,.16);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;transition:all .3s;background:rgba(0,170,255,.04);color:var(--blue);flex-shrink:0;}
#vbtn:hover{background:rgba(0,170,255,.08);}
#vbtn.active{background:rgba(255,50,50,.14);border-color:rgba(255,50,50,.38);color:#ff4444;animation:vp .85s ease-in-out infinite;}
@keyframes vp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#inp{flex:1;background:rgba(0,170,255,.025);border:1px solid rgba(0,170,255,.11);border-radius:5px;padding:9px 12px;color:var(--bright);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;caret-color:var(--blue);}
#inp::placeholder{color:rgba(0,170,255,.14);}
#inp:focus{border-color:rgba(0,170,255,.3);box-shadow:0 0 0 1px var(--blue-dim);}
#sbtn{width:38px;height:38px;background:rgba(0,170,255,.08);border:1px solid var(--blue-dim);border-radius:5px;color:var(--blue);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
#sbtn:hover{background:rgba(0,170,255,.15);transform:scale(1.04);}
#sbtn:disabled{opacity:.28;cursor:not-allowed;transform:none;}
#vst{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.2);letter-spacing:1px;padding:0 2px;}
.wf{display:flex;align-items:center;gap:2px;height:14px;}
.wb{width:2px;border-radius:1px;background:rgba(0,170,255,.1);height:3px;}
.wb.on{background:var(--blue);animation:wva 1.2s ease-in-out infinite;}
@keyframes wva{0%,100%{height:3px}50%{height:11px}}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.mb{background:#030d1c;border:1px solid rgba(0,170,255,.18);border-radius:9px;padding:24px;width:450px;max-width:92vw;box-shadow:0 0 50px rgba(0,170,255,.07);}
.mt{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;color:var(--blue);letter-spacing:4px;margin-bottom:3px;}
.ms{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.28);letter-spacing:1.5px;margin-bottom:16px;}
.mb label{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(0,170,255,.35);letter-spacing:2px;display:block;margin-bottom:5px;margin-top:12px;}
.mb input,.mb textarea{width:100%;background:rgba(0,170,255,.03);border:1px solid rgba(0,170,255,.11);border-radius:4px;padding:8px 11px;color:var(--bright);font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;caret-color:var(--blue);}
.mb input:focus,.mb textarea:focus{border-color:rgba(0,170,255,.3);}
.mb textarea{resize:vertical;min-height:90px;max-height:160px;}
.mbtns{display:flex;gap:7px;margin-top:16px;justify-content:flex-end;}
.bc{padding:7px 15px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;}
.bc:hover{border-color:rgba(0,170,255,.18);}
.bk{padding:7px 16px;background:rgba(0,170,255,.09);border:1px solid rgba(0,170,255,.28);border-radius:4px;color:var(--blue);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;}
.bk:hover{background:rgba(0,170,255,.16);}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div class="grid"></div><div class="vign"></div><div class="scan"></div>
<div class="co tl"></div><div class="co tr"></div><div class="co bl"></div><div class="co br"></div>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-logo-area">
      <div class="sb-logo">NEXUS</div>
      <div class="sb-sub">SEGUNDO CEREBRO ARTIFICIAL</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" id="tabAgentes" onclick="switchTab('agentes')">AGENTES</div>
      <div class="tab" id="tabChats" onclick="switchTab('chats')">CHATS</div>
    </div>

    <!-- PANEL AGENTES -->
    <div class="tab-panel active" id="panelAgentes">
      <button class="new-btn" onclick="openModal()">+ NOVO AGENTE</button>
      <div class="scroll-list" id="agentsList"></div>
    </div>

    <!-- PANEL CHATS -->
    <div class="tab-panel" id="panelChats">
      <button class="new-btn" onclick="newFreeChat()">+ NOVO CHAT</button>
      <div style="padding:8px 12px 4px;flex-shrink:0;">
        <div style="font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:2.5px;color:rgba(0,170,255,.28);padding-bottom:5px;border-bottom:1px solid var(--border);">HISTORICO DE CONVERSAS</div>
      </div>
      <div class="scroll-list" id="chatsList"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="mh">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="mh-dot"></div>
        <div>
          <div class="mh-name" id="mhName">N·E·X·U·S</div>
          <div class="mh-status" id="mhStatus">SEGUNDO CEREBRO ARTIFICIAL</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="wf" id="wf"></div>
        <div style="text-align:right">
          <div id="clk">--:--:--</div>
          <div id="dt">...</div>
        </div>
      </div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="typing" id="typing">
      <div class="av j" style="margin-left:20px" id="typAv">NXS</div>
      <div class="tdots"><div class="td"></div><div class="td"></div><div class="td"></div></div>
    </div>

    <div class="inz">
      <div id="vst">MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR</div>
      <div class="inz-row">
        <button id="vbtn" onclick="toggleMic()">MIC</button>
        <input type="text" id="inp" placeholder="Digite seu pensamento..." maxlength="1000"/>
        <button id="sbtn" onclick="send()">></button>
      </div>
    </div>
  </main>
</div>

<!-- MODAL AGENTE -->
<div class="mo" id="modal" style="display:none">
  <div class="mb">
    <div class="mt">NOVO AGENTE</div>
    <div class="ms">CRIE UM ESPECIALISTA PARA O SEU CEREBRO</div>
    <label>NOME DO AGENTE</label>
    <input type="text" id="aN" placeholder="Ex: MUSICA, EDICAO, ROTEIRO..." maxlength="30"/>
    <label>DESCRICAO</label>
    <input type="text" id="aD" placeholder="Em que este agente e especialista?" maxlength="80"/>
    <label>INSTRUCOES — COMO ESTE AGENTE DEVE PENSAR E RESPONDER</label>
    <textarea id="aI" placeholder="Descreva a personalidade, especialidade e comportamento deste agente. Quanto mais detalhado, melhor."></textarea>
    <div class="mbtns">
      <button class="bc" onclick="closeModal()">CANCELAR</button>
      <button class="bk" onclick="createAgent()">CRIAR AGENTE</button>
    </div>
  </div>
</div>

<script>
// BG CANVAS
const bgc=document.getElementById('bgc'),bgx=bgc.getContext('2d');
let W,H;
function rsz(){W=bgc.width=window.innerWidth;H=bgc.height=window.innerHeight;}
rsz();window.addEventListener('resize',rsz);
const BC=['#003388','#0055aa','#0077cc','#0099ee','#00bbff'];
class BP{constructor(){this.r();}r(i){const a=Math.random()*Math.PI*2,r=40+Math.random()*150;this.x=W/2+Math.cos(a)*r+(Math.random()-.5)*70;this.y=H/2+Math.sin(a)*r+(Math.random()-.5)*70;this.vx=(Math.random()-.5)*.2;this.vy=(Math.random()-.5)*.2-.1;this.l=i?Math.random():0;this.ml=.6+Math.random()*1.1;this.sz=.3+Math.random()*1.2;this.c=BC[0|Math.random()*BC.length];this.ob=Math.random()<.4;this.or=35+Math.random()*120;this.os=(.002+Math.random()*.004)*(Math.random()<.5?1:-1);this.oa=Math.random()*Math.PI*2;}step(){this.l+=.005;if(this.ob){this.oa+=this.os;this.x=W/2+Math.cos(this.oa)*this.or;this.y=H/2+Math.sin(this.oa)*this.or;}else{this.x+=this.vx;this.y+=this.vy;}if(this.l>this.ml)this.r(false);}draw(){bgx.globalAlpha=Math.sin((this.l/this.ml)*Math.PI)*.4;bgx.beginPath();bgx.arc(this.x,this.y,this.sz,0,Math.PI*2);bgx.fillStyle=this.c;bgx.shadowBlur=5;bgx.shadowColor=this.c;bgx.fill();bgx.shadowBlur=0;}}
const bps=[];for(let i=0;i<180;i++)bps.push(new BP(true));
(function df(){requestAnimationFrame(df);bgx.clearRect(0,0,W,H);const g=bgx.createRadialGradient(W/2,H/2,0,W/2,H/2,180);g.addColorStop(0,'rgba(0,80,180,.045)');g.addColorStop(.6,'rgba(0,40,120,.018)');g.addColorStop(1,'transparent');bgx.globalAlpha=1;bgx.fillStyle=g;bgx.fillRect(0,0,W,H);bgx.globalAlpha=.06;bgx.strokeStyle='#0066cc';bgx.lineWidth=.3;[45,85,130,170].forEach(r=>{bgx.beginPath();bgx.arc(W/2,H/2,r,0,Math.PI*2);bgx.stroke();});bgx.lineWidth=.2;for(let i=0;i<bps.length;i++)for(let j=i+1;j<bps.length;j++){const dx=bps[i].x-bps[j].x,dy=bps[i].y-bps[j].y,d=Math.hypot(dx,dy);if(d<48){bgx.globalAlpha=(1-d/48)*.1;bgx.strokeStyle='#0088ff';bgx.beginPath();bgx.moveTo(bps[i].x,bps[i].y);bgx.lineTo(bps[j].x,bps[j].y);bgx.stroke();}}bps.forEach(p=>{p.step();p.draw();});bgx.globalAlpha=1;})();

// BRAIN WELCOME CANVAS
let brainRaf=null;
function drawBrainOn(canvasId,size){
  const c=document.getElementById(canvasId);if(!c)return;
  c.width=size;c.height=size;
  const x=c.getContext('2d');
  const nn=[];for(let i=0;i<25;i++)nn.push({x:10+Math.random()*(size-20),y:10+Math.random()*(size-20),vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:.7+Math.random()*2.2,p:Math.random()*Math.PI*2,sp:.02+Math.random()*.03});
  if(brainRaf)cancelAnimationFrame(brainRaf);
  (function loop(){brainRaf=requestAnimationFrame(loop);x.clearRect(0,0,size,size);const g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);g.addColorStop(0,'rgba(0,120,220,.07)');g.addColorStop(.6,'rgba(0,60,180,.03)');g.addColorStop(1,'transparent');x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,0,size,size);x.lineWidth=.35;for(let i=0;i<nn.length;i++)for(let j=i+1;j<nn.length;j++){const dx=nn[i].x-nn[j].x,dy=nn[i].y-nn[j].y,d=Math.hypot(dx,dy);if(d<50){x.globalAlpha=(1-d/50)*.32;x.strokeStyle='#0088ff';x.beginPath();x.moveTo(nn[i].x,nn[i].y);x.lineTo(nn[j].x,nn[j].y);x.stroke();}}nn.forEach(n=>{n.p+=n.sp;x.globalAlpha=.35+Math.sin(n.p)*.28;x.beginPath();x.arc(n.x,n.y,n.r,0,Math.PI*2);x.fillStyle='#00aaff';x.shadowBlur=7;x.shadowColor='#0088ff';x.fill();x.shadowBlur=0;n.x+=n.vx;n.y+=n.vy;if(n.x<5||n.x>size-5)n.vx*=-1;if(n.y<5||n.y>size-5)n.vy*=-1;});x.globalAlpha=1;})();
}

// CLOCK
(function tick(){const n=new Date(),p=v=>String(v).padStart(2,'0');document.getElementById('clk').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;const D=['DOM','SEG','TER','QUA','QUI','SEX','SAB'],M=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];document.getElementById('dt').textContent=`${D[n.getDay()]} ${n.getDate()} ${M[n.getMonth()]} ${n.getFullYear()}`;setTimeout(tick,1000);})();

// WAVEFORM
(function(){const w=document.getElementById('wf');for(let i=0;i<12;i++){const b=document.createElement('div');b.className='wb';b.style.animationDelay=(i*.07)+'s';b.style.animationDuration=(.6+Math.random()*.7)+'s';w.appendChild(b);}})();
function setWF(on){document.querySelectorAll('.wb').forEach(b=>{b.className='wb'+(on?' on':'');});}

// STATE
let agents=JSON.parse(localStorage.getItem('nx_agents')||'[]');
let agentChats=JSON.parse(localStorage.getItem('nx_agent_chats')||'{}'); // {agentId: [{role,content}]}
let freeChats=JSON.parse(localStorage.getItem('nx_free_chats')||'[]');   // [{id,title,messages:[]}]
let activeAgent=null;   // agente selecionado
let activeFreeChatId=null; // chat livre selecionado
let currentMode='none'; // 'agent' | 'free' | 'none'
let busy=false;
let voiceTriggered=false; // true when triggered by voice (mic button or wake word)

function saveAll(){
  localStorage.setItem('nx_agents',JSON.stringify(agents));
  localStorage.setItem('nx_agent_chats',JSON.stringify(agentChats));
  localStorage.setItem('nx_free_chats',JSON.stringify(freeChats));
}

// TABS
function switchTab(tab){
  document.getElementById('tabAgentes').className='tab'+(tab==='agentes'?' active':'');
  document.getElementById('tabChats').className='tab'+(tab==='chats'?' active':'');
  document.getElementById('panelAgentes').className='tab-panel'+(tab==='agentes'?' active':'');
  document.getElementById('panelChats').className='tab-panel'+(tab==='chats'?' active':'');
}

// RENDER AGENTS TAB
function renderAgents(){
  const list=document.getElementById('agentsList');list.innerHTML='';
  if(!agents.length){list.innerHTML=`<div class="empty-state">NENHUM AGENTE<br>CRIADO AINDA<br><br>CLIQUE EM<br>+ NOVO AGENTE</div>`;return;}
  agents.forEach(a=>{
    const d=document.createElement('div');
    d.className='agent-item'+(activeAgent&&activeAgent.id===a.id&&currentMode==='agent'?' sel':'');
    d.innerHTML=`<div class="ai-name">${a.name}</div><div class="ai-desc">${a.desc}</div><button class="item-del" onclick="delAgent('${a.id}',event)">x</button>`;
    d.onclick=()=>selectAgent(a);
    list.appendChild(d);
  });
}

function selectAgent(a){
  activeAgent=a;activeFreeChatId=null;currentMode='agent';
  document.getElementById('mhName').textContent=a.name;
  document.getElementById('mhStatus').textContent=a.desc.slice(0,55);
  document.getElementById('typAv').textContent=a.name.slice(0,3);
  document.getElementById('inp').placeholder=`Fale com ${a.name}...`;
  renderAgents();renderFreeChats();renderChatArea();
}

function delAgent(id,e){
  e.stopPropagation();if(!confirm('Deletar agente?'))return;
  agents=agents.filter(a=>a.id!==id);delete agentChats[id];saveAll();
  if(activeAgent&&activeAgent.id===id){activeAgent=null;currentMode='none';resetHeader();showWelcome();}
  renderAgents();
}

// RENDER FREE CHATS TAB
function renderFreeChats(){
  const list=document.getElementById('chatsList');list.innerHTML='';
  if(!freeChats.length){
    list.innerHTML=`<div class="empty-state">NENHUMA CONVERSA<br>AINDA<br><br>CLIQUE EM<br>+ NOVO CHAT<br>PARA COMECAR</div>`;
    return;
  }
  freeChats.forEach(c=>{
    const d=document.createElement('div');
    d.className='chat-item'+(c.id===activeFreeChatId&&currentMode==='free'?' sel':'');
    const lastMsg=c.messages.length?c.messages[c.messages.length-1].content.slice(0,35)+'...':'Conversa vazia';
    const msgCount=c.messages.length;
    const date=c.createdAt?new Date(c.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    d.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="ci-title" style="max-width:130px">${c.title}</div>
        <button class="item-del" onclick="delFreeChat('${c.id}',event)">x</button>
      </div>
      <div class="ci-meta" style="margin-top:3px;color:rgba(0,170,255,.3);font-size:7px">${lastMsg}</div>
      <div style="display:flex;justify-content:space-between;margin-top:4px">
        <div class="ci-meta">${date}</div>
        <div class="ci-meta">${msgCount} msgs</div>
      </div>
    `;
    d.onclick=()=>selectFreeChat(c.id);
    list.appendChild(d);
  });
}

function newFreeChat(){
  const id='fc_'+Date.now();
  const title='CHAT '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  freeChats.unshift({id,title,messages:[],createdAt:new Date().toISOString()});saveAll();
  activeFreeChatId=id;activeAgent=null;currentMode='free';
  resetHeader();renderFreeChats();renderChatArea();
  switchTab('chats');
}

function selectFreeChat(id){
  activeFreeChatId=id;activeAgent=null;currentMode='free';
  resetHeader();renderFreeChats();renderAgents();renderChatArea();
}

function delFreeChat(id,e){
  e.stopPropagation();if(!confirm('Deletar conversa?'))return;
  freeChats=freeChats.filter(c=>c.id!==id);saveAll();
  if(activeFreeChatId===id){activeFreeChatId=null;currentMode='none';showWelcome();}
  renderFreeChats();
}

function resetHeader(){
  document.getElementById('mhName').textContent='N·E·X·U·S';
  document.getElementById('mhStatus').textContent='SEGUNDO CEREBRO ARTIFICIAL';
  document.getElementById('typAv').textContent='NXS';
  document.getElementById('inp').placeholder='Digite seu pensamento...';
}

// CHAT AREA
function renderChatArea(){
  const ca=document.getElementById('chatArea');ca.innerHTML='';
  let msgs=[];
  if(currentMode==='agent'&&activeAgent){msgs=agentChats[activeAgent.id]||[];}
  else if(currentMode==='free'&&activeFreeChatId){const fc=freeChats.find(c=>c.id===activeFreeChatId);msgs=fc?fc.messages:[];}
  if(!msgs.length){showContextWelcome();return;}
  msgs.forEach(m=>addMsgEl(m.role,m.content));ca.scrollTop=9999;
}

function showWelcome(){
  const ca=document.getElementById('chatArea');ca.innerHTML='';
  const w=document.createElement('div');w.className='welcome';
  w.innerHTML=`<div class="brain-wrap"><canvas id="bc2"></canvas></div><div class="w-title">NEXUS</div><div class="w-sub">SEGUNDO CEREBRO ARTIFICIAL<br>SELECIONE UM AGENTE OU INICIE UM CHAT</div><div class="qcs"><div class="qc" onclick="sc('Que horas sao?')">HORAS</div><div class="qc" onclick="sc('Que dia e hoje?')">DATA</div><div class="qc" onclick="askCity()">CLIMA</div></div>`;
  ca.appendChild(w);drawBrainOn('bc2',160);
}

function showContextWelcome(){
  const ca=document.getElementById('chatArea');ca.innerHTML='';
  const w=document.createElement('div');w.className='welcome';
  const name=activeAgent?activeAgent.name:'NOVO CHAT';
  const sub=activeAgent?activeAgent.desc:'CONVERSA LIVRE — SEM AGENTE ESPECIFICO';
  w.innerHTML=`<div class="brain-wrap"><canvas id="bc2"></canvas></div><div class="w-title" style="font-size:14px">${name}</div><div class="w-sub">${sub}</div><div class="qcs"><div class="qc" onclick="sc('O que voce pode fazer?')">CAPACIDADES</div><div class="qc" onclick="sc('Que horas sao?')">HORAS</div><div class="qc" onclick="askCity()">CLIMA</div></div>`;
  ca.appendChild(w);drawBrainOn('bc2',140);
}

function addMsgEl(role,content){
  const ca=document.getElementById('chatArea');
  const w=ca.querySelector('.welcome');if(w)w.remove();
  const isJ=role==='assistant';
  const wrap=document.createElement('div');wrap.className='msg '+(isJ?'j':'u');
  const av=document.createElement('div');av.className='av '+(isJ?'j':'u');av.textContent=isJ?(activeAgent?.name?.slice(0,3)||'NXS'):'GUI';
  const bub=document.createElement('div');bub.className='bub';
  const lbl=document.createElement('div');lbl.className='msg-lbl';lbl.textContent=isJ?(activeAgent?.name||'NEXUS'):'GUI';
  const txt=document.createElement('div');
  txt.innerHTML=content.replace(/\*\*(.*?)\*\*/g,'<strong style="color:#d0eeff">$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
  bub.appendChild(lbl);bub.appendChild(txt);wrap.appendChild(av);wrap.appendChild(bub);
  ca.appendChild(wrap);ca.scrollTop=9999;
}

function pushMsg(role,content){
  if(currentMode==='agent'&&activeAgent){
    if(!agentChats[activeAgent.id])agentChats[activeAgent.id]=[];
    agentChats[activeAgent.id].push({role,content});
  } else if(currentMode==='free'&&activeFreeChatId){
    const fc=freeChats.find(c=>c.id===activeFreeChatId);
    if(fc){
      fc.messages.push({role,content});
      // update title from first user msg
      if(role==='user'&&fc.messages.filter(m=>m.role==='user').length===1)fc.title=content.slice(0,28).toUpperCase();
    }
  }
  saveAll();addMsgEl(role,content);renderFreeChats();
}

function setTyp(on){document.getElementById('typing').className='typing'+(on?' on':'');setWF(on);if(on)document.getElementById('chatArea').scrollTop=9999;}

// MODAL
function openModal(){document.getElementById('modal').style.display='flex';document.getElementById('aN').value='';document.getElementById('aD').value='';document.getElementById('aI').value='';setTimeout(()=>document.getElementById('aN').focus(),80);}
function closeModal(){document.getElementById('modal').style.display='none';}
function createAgent(){
  const n=document.getElementById('aN').value.trim();
  const d=document.getElementById('aD').value.trim();
  const i=document.getElementById('aI').value.trim();
  if(!n){alert('Nome obrigatorio!');return;}
  if(!i){alert('Instrucoes obrigatorias!');return;}
  const a={id:'a_'+Date.now(),name:n.toUpperCase(),desc:d||'Agente especializado',instr:i};
  agents.unshift(a);saveAll();renderAgents();closeModal();selectAgent(a);switchTab('agentes');
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// WAKE WORD SYSTEM
const WAKE_WORDS=['ei nexus','oi nexus','hey nexus','nexus'];
let wakeActive=false,wakeRecog=null,cmdRecog=null,isSpeaking=false,bestVoice=null;

function loadVoices(){
  const try_=()=>{
    const vs=window.speechSynthesis.getVoices();
    if(!vs.length){setTimeout(try_,100);return;}
    const pri=[v=>v.name.includes('Luciana'),v=>v.name.includes('Google')&&v.lang==='pt-BR',v=>v.lang==='pt-BR',v=>v.lang.startsWith('pt')];
    for(const t of pri){const v=vs.find(t);if(v){bestVoice=v;break;}}
  };
  if(window.speechSynthesis.getVoices().length)try_();
  else window.speechSynthesis.onvoiceschanged=try_;
}
loadVoices();

function speak(text,onDone){
  if(!window.speechSynthesis){if(onDone)onDone();return;}
  window.speechSynthesis.cancel();
  const clean=text.replace(/\*\*(.*?)\*\*/g,'$1').replace(/\*(.*?)\*/g,'$1').replace(/[#\n]/g,' ').trim().slice(0,500);
  const u=new SpeechSynthesisUtterance(clean);
  if(bestVoice)u.voice=bestVoice;
  u.lang='pt-BR';u.rate=0.9;u.pitch=1.0;u.volume=1.0;
  isSpeaking=true;
  const done=()=>{isSpeaking=false;if(onDone)onDone();if(wakeActive)setTimeout(startWakeListen,300);};
  u.onend=done;u.onerror=done;
  window.speechSynthesis.speak(u);
}

function beep(){
  try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(660,ac.currentTime);o.frequency.exponentialRampToValueAtTime(880,ac.currentTime+.12);g.gain.setValueAtTime(.16,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.start();o.stop(ac.currentTime+.2);}catch(e){}
}

function toggleMic(){
  if(wakeActive){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setVst('USE GOOGLE CHROME','#ff4444');return;}
  navigator.mediaDevices.getUserMedia({audio:true})
    .then(s=>{s.getTracks().forEach(t=>t.stop());startVoice();})
    .catch(()=>setVst('PERMISSAO NEGADA — VERIFIQUE O CHROME','#ff4444'));
}

function startVoice(){
  wakeActive=true;
  setMicUI('wake');
  setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.6)');
  speak('Sistema de voz ativo. Me chame quando precisar.',()=>startWakeListen());
}

function stopVoice(){
  wakeActive=false;
  try{wakeRecog&&wakeRecog.abort();}catch(e){}
  try{cmdRecog&&cmdRecog.abort();}catch(e){}
  window.speechSynthesis.cancel();
  isSpeaking=false;setMicUI('off');setWF(false);
  setVst('MICROFONE INATIVO','rgba(0,170,255,.2)');
}

function startWakeListen(){
  if(!wakeActive||isSpeaking)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  wakeRecog=new SR();wakeRecog.lang='pt-BR';wakeRecog.continuous=false;wakeRecog.interimResults=false;wakeRecog.maxAlternatives=5;
  wakeRecog.onresult=e=>{
    if(!wakeActive)return;
    const alts=Array.from(e.results[0]).map(a=>a.transcript.toLowerCase().trim());
    if(alts.some(t=>WAKE_WORDS.some(w=>t.includes(w)))){onWake();}
    else resumeWake();
  };
  wakeRecog.onerror=e=>{if(e.error!=='aborted'&&wakeActive)setTimeout(resumeWake,500);};
  wakeRecog.onend=()=>{if(wakeActive&&!isSpeaking)resumeWake();};
  try{wakeRecog.start();}catch(e){setTimeout(resumeWake,400);}
}

function resumeWake(){
  if(!wakeActive||isSpeaking)return;
  try{wakeRecog&&wakeRecog.abort();}catch(e){}
  setTimeout(()=>{if(wakeActive&&!isSpeaking)startWakeListen();},260);
}

function onWake(){
  setMicUI('listening');setVst('OUVINDO...','#00aaff');setWF(true);beep();
  setTimeout(startCmdListen,380);
}

function startCmdListen(){
  if(!wakeActive)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  let got=false;
  cmdRecog=new SR();cmdRecog.lang='pt-BR';cmdRecog.continuous=false;cmdRecog.interimResults=false;cmdRecog.maxAlternatives=3;
  cmdRecog.onresult=e=>{
    got=true;
    const cmd=e.results[0][0].transcript.trim();
    if(cmd.length<2){resumeWake();return;}
    document.getElementById('inp').value=cmd;
    setMicUI('proc');setWF(false);
    setVst('PROCESSANDO...','#ffaa00');
    send(true);
  };
  cmdRecog.onerror=()=>{if(!got){setMicUI('wake');setWF(false);setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.6)');resumeWake();}};
  cmdRecog.onend=()=>{if(!got){setMicUI('wake');setWF(false);resumeWake();}};
  try{cmdRecog.start();}catch(e){setMicUI('wake');resumeWake();}
}

function setMicUI(s){
  const b=document.getElementById('vbtn');
  const styles={
    off:['','MIC','',''],
    wake:['','MIC','rgba(0,170,255,.08)','rgba(0,170,255,.2)'],
    listening:['active','OUV','',''],
    proc:['','PROC','rgba(255,150,0,.1)','rgba(255,150,0,.3)']
  };
  const [cls,txt,bg,bc]=styles[s]||styles.off;
  b.className=cls;b.textContent=txt;
  if(bg)b.style.background=bg;if(bc)b.style.borderColor=bc;
}

function setVst(msg,col){const el=document.getElementById('vst');el.textContent=msg;el.style.color=col||'rgba(0,170,255,.2)';}


// SEND
async function send(fromVoice=false){
  if(busy)return;
  const el=document.getElementById('inp'),text=el.value.trim();
  if(!text)return;
  if(currentMode==='none'){alert('Selecione um agente ou inicie um novo chat!');return;}
  voiceTriggered=fromVoice;
  el.value='';busy=true;document.getElementById('sbtn').disabled=true;

  // HORAS
  if(/que horas|horas sao|hora certa/i.test(text)){
    const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
    const r=`Sao ${h}h${m}, Gui.`;pushMsg('user',text);pushMsg('assistant',r);if(voiceTriggered)speak(r,()=>{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.6)');}}); else if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.6)');};
    busy=false;document.getElementById('sbtn').disabled=false;el.focus();if(!wakeActive)setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');return;
  }

  // DATA
  if(/que dia|data de hoje|dia e hoje/i.test(text)){
    const n=new Date();const D=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];const M=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const r=`Hoje e ${D[n.getDay()]}, ${n.getDate()} de ${M[n.getMonth()]} de ${n.getFullYear()}.`;pushMsg('user',text);pushMsg('assistant',r);if(voiceTriggered)speak(r,()=>{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.6)');}}); else if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.6)');};
    busy=false;document.getElementById('sbtn').disabled=false;el.focus();if(!wakeActive)setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');return;
  }

  // CLIMA
  const wm=text.match(/(?:previsao|tempo|clima).*?(?:em|de|para|na?)\s+([a-zA-Z\s]+?)(?:\?|$)/i);
  if(wm||/previsao do tempo|como esta o tempo|vai chover|temperatura/i.test(text)){
    let city=(wm&&wm[1])||'';city=city.trim()||'Porto Alegre';
    pushMsg('user',text);setTyp(true);
    try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[],command:{type:'weather',city}})});const d=await r.json();const rep=d.content[0].text;setTyp(false);pushMsg('assistant',rep);speak(rep);}
    catch(e){setTyp(false);pushMsg('assistant','Erro ao consultar clima.');}
    busy=false;document.getElementById('sbtn').disabled=false;el.focus();setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');return;
  }

  // IA
  pushMsg('user',text);setTyp(true);setVst('PROCESSANDO...','#0088ff');
  const sysPrompt=activeAgent?activeAgent.instr:`Voce e NEXUS, um assistente de IA pessoal sofisticado e direto. Fale em portugues brasileiro. Seja inteligente e preciso.`;
  const hist=currentMode==='agent'?(agentChats[activeAgent.id]||[]):((freeChats.find(c=>c.id===activeFreeChatId)||{messages:[]}).messages);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-20),agentInstr:sysPrompt})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    const rep=d.content[0].text;setTyp(false);pushMsg('assistant',rep);
    speak(rep,()=>{if(wakeActive){setMicUI('wake');setVst('DIGA "EI NEXUS" PARA ATIVAR','rgba(0,200,255,.6)');}else{setVst('MICROFONE INATIVO — CLIQUE EM MIC PARA ATIVAR','rgba(0,170,255,.2)');}});
  }catch(e){setTyp(false);pushMsg('assistant','Erro: '+e.message);setVst('ERRO DE CONEXAO','#ff4444');}
  busy=false;document.getElementById('sbtn').disabled=false;el.focus();
}

function sc(t){if(currentMode==='none'){if(freeChats.length===0)newFreeChat();else{activeFreeChatId=freeChats[0].id;currentMode='free';renderFreeChats();renderChatArea();}}document.getElementById('inp').value=t;send();}
function askCity(){const c=prompt('Qual cidade?','Porto Alegre');if(c)sc('previsao do tempo em '+c);}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

// INIT
renderAgents();renderFreeChats();showWelcome();
</script>
